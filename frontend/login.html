<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Review System - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    .card { max-width: 420px; margin: 0 auto; border: 1px solid #e5e5e5; border-radius: 8px; padding: 20px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    .sub { color: #666; margin: 0 0 18px; }
    label { display:block; margin-top: 12px; font-weight: 600; }
    input[type="text"], input[type="password"] {
      width:100%; padding:10px; margin-top:6px; border:1px solid #ccc; border-radius:6px; box-sizing: border-box;
    }
    button { margin-top:16px; padding:12px; width:100%; background:#4c93af; color:#fff; border:0; border-radius:6px; cursor:pointer; }
    button:hover { background:#3f7f96; }
    .linkrow { display:flex; justify-content: space-between; margin-top: 12px; }
    a { color:#4c93af; text-decoration:none; }
    a:hover { text-decoration: underline; }
    #message { margin-top: 12px; font-weight: 600; }
    .ok { color: #0a7d27; }
    .err { color: #b30000; }
    .muted { color:#666; font-size: 14px; }
    .actions { margin-top: 10px; display:none; }
    .actions button { width: auto; background:#4CAF50; padding:8px 12px; margin-right:8px; }
    .home-button {
      display:inline-block; padding: 8px 16px; font-size: 14px; color:#fff; background-color:#4c93af;
      border:none; border-radius:4px; text-decoration:none; text-align:center; cursor:pointer; margin-top: 16px;
    }
    .home-button:hover { background-color:#45a049; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Login</h1>
    <p class="sub">Please log in with your student number and password.</p>

    <form id="loginForm" novalidate>
      <label for="student_number">Student Number</label>
      <input type="text" id="student_number" name="student_number" required autocomplete="username" />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" />

      <button type="submit" id="loginBtn">Login</button>

      <div class="linkrow">
        <a href="forgot.html">Forgot Password?</a>
        <a href="index.html">Home</a>
      </div>

      <p id="message" class="muted"></p>

      <!-- Unverified account actions -->
      <div id="unverifiedActions" class="actions">
        <p class="muted" id="unverifiedHint"></p>
        <button type="button" id="resendBtn">Resend Code</button>
        <a href="verify.html" id="goVerify" class="home-button" style="padding:6px 10px; background:#777;">Verification Page</a>
      </div>
    </form>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
