<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    form { max-width: 420px; margin: auto; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input[type="text"], input[type="password"], input[type="email"] {
      width: 100%; padding: 10px; margin-top: 6px; box-sizing: border-box;
      border: 1px solid #ccc; border-radius: 6px;
    }
    small { color: #555; }
    button {
      margin-top: 16px; padding: 12px; width: 100%;
      background-color: #4CAF50; color: #fff; border: none; border-radius: 6px; cursor: pointer;
    }
    button:hover { background-color: #45a049; }
    .error { margin-top: 12px; font-weight: 600; }

    /* Loader (spinner) */
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 1s linear infinite;
      margin: 16px auto;
      display: none; /* başta gizli */
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Back to Home button */
    #backHome {
      display: none;
      margin-top: 16px;
      padding: 12px;
      width: 100%;
      background-color: #2c3e50;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    #backHome:hover { background-color: #1a242f; }
  </style>
</head>
<body>
  <h2>Register</h2>

  <form id="registerForm" novalidate>
    <label for="student_number">Student Number</label>
    <input type="text" id="student_number" name="student_number" required />

    <label for="first_name">First Name</label>
    <input type="text" id="first_name" name="first_name" required />

    <label for="last_name">Last Name</label>
    <input type="text" id="last_name" name="last_name" required />

    <label for="email">Hacettepe Email</label>
    <input
      type="email"
      id="email"
      name="email"
      required
      placeholder="name.surname@hacettepe.edu.tr"
      pattern="^[a-z0-9._%+-]+@hacettepe\.edu\.tr$"
    />
    <small>Only <b>@hacettepe.edu.tr</b> domain emails are accepted.</small>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required minlength="6" />

    <label for="confirm_password">Confirm Password</label>
    <input type="password" id="confirm_password" name="confirm_password" required minlength="6" />

    <button type="submit">Register</button>
    <div class="spinner" id="spinner"></div>
    <p class="error" id="errorMessage"></p>
  </form>

  <!-- Back to home -->
  <a id="backHome" href="index.html">Back to Home</a>

  <script src="js/register.js"></script>
</body>
</html>
