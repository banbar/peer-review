<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Yeni Şifre Belirle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --brand:#4c93af; --brandHover:#3f7f96; --ok:#0a7d27; --err:#b30000; --muted:#666; }
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 24px; background:#fafafa; }
    .card { max-width: 440px; margin: 0 auto; background:#fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 22px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p.sub { color: var(--muted); margin: 0 0 18px; }
    label { display:block; margin-top: 12px; font-weight: 600; }
    input[type="password"] { width:100%; padding:11px; margin-top:6px; border:1px solid #ccc; border-radius:8px; background:#fff; }
    button { margin-top:16px; padding:12px; width:100%; background:var(--brand); color:#fff; border:0; border-radius:8px; cursor:pointer; font-weight:600; }
    button:hover { background:var(--brandHover); }
    button[disabled] { opacity:.7; cursor:not-allowed; }
    #msg { margin-top: 12px; }
    .ok { color: var(--ok); font-weight: 600; }
    .err { color: var(--err); font-weight: 600; }
    .muted { color: var(--muted); font-size: 14px; }
    a { color: var(--brand); text-decoration:none; font-size:14px; }
    a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Yeni Şifre Belirle</h1>
    <p class="sub">Geçici şifreyle giriş yaptığınız için yeni şifre belirlemeniz gerekiyor.</p>

    <label for="current_password">Mevcut (Geçici) Şifre</label>
    <input type="password" id="current_password" autocomplete="current-password" placeholder="Geçici şifreniz" />

    <label for="new_password">Yeni Şifre</label>
    <input type="password" id="new_password" autocomplete="new-password" placeholder="En az 8 karakter" />

    <label for="new_password2">Yeni Şifre (Tekrar)</label>
    <input type="password" id="new_password2" autocomplete="new-password" placeholder="Yeni şifre tekrar" />

    <button id="saveBtn" type="button">Şifreyi Güncelle</button>

    <p id="msg" class="muted"></p>

    <div style="margin-top: 10px;">
      <a href="login.html">Giriş sayfasına dön</a>
    </div>
  </div>

  <script>
    const curEl = document.getElementById('current_password');
    const p1El  = document.getElementById('new_password');
    const p2El  = document.getElementById('new_password2');
    const msgEl = document.getElementById('msg');
    const btn   = document.getElementById('saveBtn');

    function setMsg(t, cls='muted') {
      msgEl.textContent = t;
      msgEl.className = cls;
    }

    // Enter ile gönder
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') btn.click();
    });

    btn.addEventListener('click', async () => {
      const current_password = (curEl.value || '').trim();
      const new_password     = (p1El.value || '').trim();
      const new_password2    = (p2El.value || '').trim();

      if (!current_password || !new_password || !new_password2) {
        return setMsg('Tüm alanlar zorunludur.', 'err');
      }
      if (new_password.length < 8) {
        return setMsg('Yeni şifre en az 8 karakter olmalı.', 'err');
      }
      if (new_password !== new_password2) {
        return setMsg('Yeni şifreler eşleşmiyor.', 'err');
      }
      if (current_password === new_password) {
        return setMsg('Yeni şifre mevcut şifreyle aynı olamaz.', 'err');
      }

      btn.disabled = true;
      setMsg('Şifre güncelleniyor…', 'muted');
      try {
        const r = await fetch('/auth/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',                  // << cookie (JWT) için şart
          body: JSON.stringify({ current_password, new_password })
        });
        const j = await r.json();

        if (r.ok) {
          setMsg(j.message || 'Şifre güncellendi.', 'ok');
          // İstersen direkt dashboard'a geç:
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
        } else {
          setMsg(j.error || 'Şifre güncellenemedi.', 'err');
        }
      } catch (e) {
        console.error(e);
        setMsg('Sunucuya ulaşılamadı.', 'err');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
